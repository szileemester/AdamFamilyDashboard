<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a27" />
    <title>Adam's family dashboard</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
</head>

<body>
    <div id="app">
        <div class="boot">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Váratlan hiba történt.
        <a href="." class="reload">Újratöltés</a>
        <span class="dismiss">✕</span>
    </div>
    <!-- Ujjlenyomat nélküli cím: a szerver MapStaticAssets-e az ujjlenyomatos fájlra képezi le. A {fingerprint}
         helyőrzőt a hosztolt (Server által kiszolgált) publish nem cseréli ki, élesben 404 lett volna. -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/interactions.js"></script>
    <script>
        // Új verzió telepítésekor egyszer újratölt, hogy ne a régi, gyorsítótárazott app fusson tovább.
        // Első telepítéskor (még nem volt service worker) nincs újratöltés.
        (() => {
            const sw = navigator.serviceWorker;
            if (!sw) return;
            let reload = !!sw.controller;
            sw.addEventListener('controllerchange', () => { if (reload) { reload = false; location.reload(); } });
            sw.register('service-worker.js', { updateViaCache: 'none' });
        })();
    </script>
</body>

</html>
