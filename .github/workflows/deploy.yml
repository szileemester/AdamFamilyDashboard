name: Build és deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # OIDC az Azure-ba (nincs tárolt jelszó)
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Teszt
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/AdaManagement.Server -c Release -o publish

      - name: EF migration bundle
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations bundle --project src/AdaManagement.Server --configuration Release \
            --self-contained -r linux-x64 -o efbundle --force

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            publish
            efbundle

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Az SQL tűzfal csak az Azure-szolgáltatásokat engedi: a futó gép IP-jét a migráció idejére vesszük fel.
      - name: Ideiglenes SQL tűzfalszabály
        run: |
          IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" --start-ip-address "$IP" --end-ip-address "$IP"

      - name: Adatbázis migráció
        run: |
          chmod +x efbundle
          ./efbundle --connection "${{ secrets.SQL_CONNECTION_STRING }}"

      - name: Tűzfalszabály törlése
        if: always()
        run: |
          az sql server firewall-rule delete -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" || true

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
